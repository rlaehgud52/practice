<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f49">
  <title>내 CBT 보관함</title>
  <link rel="stylesheet" href="/library.css">
</head>
<body class="library-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="내 CBT 홈">
      <span class="brand-mark">C</span><span>내 CBT</span>
    </a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a class="active" href="/">보관함</a>
      <a class="coming-soon" href="#" aria-disabled="true">카드 복습 <small>준비 중</small></a>
      <a class="coming-soon" href="#" aria-disabled="true">메모 모아보기 <small>준비 중</small></a>
      <a class="coming-soon" href="#" aria-disabled="true">PDF 올리기 <small>준비 중</small></a>
    </nav>
  </header>

  <main class="library-main">
    <section class="welcome-row" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">MY STUDY SPACE</p>
        <h1 id="page-title">내 CBT 보관함</h1>
        <p class="welcome-copy">지금까지 만든 시험을 이어서 풀고, 다시 복습하세요.</p>
      </div>
      <a class="upload-button disabled-link" href="#" aria-disabled="true">＋ 새 PDF 올리기 <span>준비 중</span></a>
    </section>

    <section class="stats-panel" aria-label="학습 현황">
      <div class="stat"><span>보관한 CBT</span><strong><b id="bankCount">—</b><small>개</small></strong></div>
      <div class="stat"><span>전체 문항</span><strong><b id="questionCount">—</b><small>문항</small></strong></div>
      <div class="stat"><span>응답한 문항</span><strong><b id="answeredCount">—</b><small>문항</small></strong></div>
    </section>

    <section class="library-section" aria-labelledby="library-title">
      <div class="section-heading">
        <div><p class="eyebrow">LIBRARY</p><h2 id="library-title">시험 목록</h2></div>
        <p class="save-note">풀이 기록은 이 브라우저에 저장됩니다</p>
      </div>
      <div id="examList" class="exam-grid" aria-live="polite">
        <p class="loading-message">보관함을 불러오고 있습니다…</p>
      </div>
    </section>
    <p id="loadError" class="load-error" role="status" hidden></p>
  </main>
  <script src="/library.js" defer></script>
</body>
</html>
